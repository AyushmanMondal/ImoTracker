<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">
            Workspace
        </div>

        <nav>
            <button class="nav-btn active">Home</button>
            <button class="nav-btn">Documents</button>
            <button class="nav-btn">Templates</button>
            <button class="nav-btn">Search</button>
            <button class="nav-btn">Settings</button>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <input
                type="text"
                placeholder="Search..."
                class="search-input"
            >
        </header>

        <section class="workspace">

            <h1>Document Editor</h1>

            <p>
                Write anything below. Nothing is saved on the website.
                Refreshing the page clears everything.
                Export your work as a text file whenever you want.
            </p>

            <input
                type="text"
                id="docTitle"
                class="title-input"
                placeholder="Document Title"
            >

            <textarea
                id="docContent"
                class="editor"
                placeholder="Start writing..."
            ></textarea>

            <button id="exportBtn" class="export-btn">
                Export .txt
            </button>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
