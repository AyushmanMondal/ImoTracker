<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <aside class="sidebar">
            <div class="logo">
                Workspace
            </div>

            <nav>
                <button class="nav-btn active">Home</button>
                <button class="nav-btn">Objects</button>
                <button class="nav-btn">Templates</button>
                <button class="nav-btn">Search</button>
                <button class="nav-btn">Settings</button>
            </nav>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <input
                    type="text"
                    placeholder="Search..."
                    class="search-input"
                >
            </header>

            <section class="workspace">

                <h1>Welcome</h1>

                <p>
                    This is the foundation of your platform.
                </p>

                <div class="cards">

                    <div class="card">
                        <h3>Objects</h3>
                        <p>Store anything.</p>
                    </div>

                    <div class="card">
                        <h3>Types</h3>
                        <p>Create custom structures.</p>
                    </div>

                    <div class="card">
                        <h3>Templates</h3>
                        <p>Build reusable systems.</p>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
